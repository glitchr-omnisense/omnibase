# The core's CI, two jobs:
#
# - package: glitchr-studio/ci's reusable workflow - the core installed alone
#   (its require-dev with it, no site), composer validate, PHPStan (level 6)
#   against phpstan-baseline.neon (new violations fail), then the core installed into
#   an empty project without require-dev and with no Composer plugin allowed
#   (omnibridge/composer stays optional), and the Foundation loaded there
#   with the autoloader alone (docker/bin/bare: no framework class loaded).
# - harness: the harness of docker/ (the core with every omnibase/* plugin
#   as one Symfony application, docker/Dockerfile as it is), each plugin and
#   omnibridge/react and omnibridge/doctrine from its repository as
#   compose.checkouts.yml mounts them: the core's suite (its BareTest on the
#   --no-dev vendor, AppClassOverAliasTest, StubsTest among them), each
#   plugin's suite, the container and templates linted, the stubs and the
#   patch checked against what omnibridge/composer generates.
name: ci

on:
  push:
    branches: ['4.x']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  package:
    uses: glitchr-studio/ci/.github/workflows/php-package.yml@main
    with:
      phpunit: false
      consumer-require: 'omniscient/omniauth:1.x-dev omniauth/webauthn:1.x-dev omniauth/otp:1.x-dev'
      consumer-script: 'OMNIBASE_AUTOLOAD="$PWD/vendor/autoload.php" php "$PACKAGE_DIR/docker/bin/bare"'

  harness:
    name: Harness (core and plugins)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      OMNIBASE_PLUGINS: ${{ github.workspace }}/plugins
      OMNIBRIDGE: ${{ github.workspace }}/omnibridge
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
      COMPOSE: docker compose -f core/docker/compose.yml -f core/docker/compose.checkouts.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: core}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: glitchr-studio/omnibase-admin, path: plugins/admin}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: glitchr-studio/omnibase-marketplace, path: plugins/marketplace}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: glitchr-studio/omnibase-forge, path: plugins/forge}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: glitchr-studio/omnibase-forum, path: plugins/forum}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: glitchr-studio/omnibase-mailbox, path: plugins/mailbox}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: glitchr-studio/omnibase-docs, path: plugins/docs}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: glitchr-studio/omnibase-blog, path: plugins/blog}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: glitchr-studio/omnibase-classroom, path: plugins/classroom}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: glitchr-studio/omnibridge-react, path: omnibridge/react}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: glitchr-studio/omnibridge-doctrine, path: omnibridge/doctrine}

      - name: Build the harness
        run: DOCKER_BUILDKIT=1 docker build -f core/docker/Dockerfile -t omniscient/omnibase-harness --secret id=composer_auth,env=COMPOSER_AUTH core

      - name: Core suite
        run: $COMPOSE run --rm -e COMPOSER_AUTH omnibase test
      - name: admin suite
        if: success() || failure()
        run: $COMPOSE run --rm omnibase test admin
      - name: marketplace suite
        if: success() || failure()
        run: $COMPOSE run --rm omnibase test marketplace
      - name: forge suite
        if: success() || failure()
        run: $COMPOSE run --rm omnibase test forge
      - name: forum suite
        if: success() || failure()
        run: $COMPOSE run --rm omnibase test forum
      - name: mailbox suite
        if: success() || failure()
        run: $COMPOSE run --rm omnibase test mailbox
      - name: docs suite
        if: success() || failure()
        run: $COMPOSE run --rm omnibase test docs
      - name: blog suite
        if: success() || failure()
        run: $COMPOSE run --rm omnibase test blog
      - name: classroom suite
        if: success() || failure()
        run: $COMPOSE run --rm omnibase test classroom
      - name: Container and templates linted
        if: success() || failure()
        run: $COMPOSE run --rm omnibase check
      - name: Stubs and patches as omnibridge/composer generates them
        if: success() || failure()
        run: |
          $COMPOSE run --rm omnibase composer omnibridge:stubs --check
          $COMPOSE run --rm omnibase composer omnibridge:patches --check
