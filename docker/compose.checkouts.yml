# The checkouts beside this one, mounted over the installed packages: what
# you edit is what runs. OMNIBASE_PLUGINS (.env) is the directory holding
# them, ../.. by default - the workspace this core sits in.
services:
  omnibase:
    volumes:
      - ..:/srv/demo/vendor/omnisense/omnibase
      - ${OMNIBASE_PLUGINS:-../..}/admin:/srv/demo/vendor/omnibase/admin
      - ${OMNIBASE_PLUGINS:-../..}/marketplace:/srv/demo/vendor/omnibase/marketplace
      - ${OMNIBASE_PLUGINS:-../..}/forge:/srv/demo/vendor/omnibase/forge
      - ${OMNIBASE_PLUGINS:-../..}/forum:/srv/demo/vendor/omnibase/forum
      - ${OMNIBASE_PLUGINS:-../..}/mailbox:/srv/demo/vendor/omnibase/mailbox
      - ${OMNIBASE_PLUGINS:-../..}/docs:/srv/demo/vendor/omnibase/docs
      # Not installed by the image: their tests' bootstraps register their own
      # classes (and the omnibase/* bundles they require, read beside them),
      # and the demo's bundles.php and routes/plugins.php, mounted as checked
      # out, register their bundles and pages once they are loaded; demo.sh as
      # checked out as well.
      - ${OMNIBASE_PLUGINS:-../..}/blog:/srv/demo/vendor/omnibase/blog
      - ${OMNIBASE_PLUGINS:-../..}/classroom:/srv/demo/vendor/omnibase/classroom
      - ${OMNIBASE_PLUGINS:-../..}/agenda:/srv/demo/vendor/omnibase/agenda
      - ${OMNIBASE_PLUGINS:-../..}/scholar:/srv/demo/vendor/omnibase/scholar
      - ${OMNIBASE_PLUGINS:-../..}/press:/srv/demo/vendor/omnibase/press
      - ${OMNIBASE_PLUGINS:-../..}/consulting:/srv/demo/vendor/omnibase/consulting
      # omnisense/omnischolar, which the image does not install: the scholar's tests' bootstrap
      # registers its classes from here (OMNISCHOLAR: the family's workspace, ../../../omnischolar).
      - ${OMNISCHOLAR:-../../../omnischolar}/core:/srv/demo/vendor/omnisense/omnischolar:ro
      # omnibridge/react, which the image does not install: the core's ScreenResponderTest
      # speaks its protocol when it finds the checkout here (OMNIBRIDGE: ../../../omnibridge).
      - ${OMNIBRIDGE:-../../../omnibridge}/react:/srv/omnibridge/react:ro
      # omnibridge/doctrine as checked out over the image's (cf6b3b9): the hand-built entity manager's
      # test passes it Mapping::configure() (its configure:, from 4d2436d).
      - ${OMNIBRIDGE:-../../../omnibridge}/doctrine:/srv/demo/vendor/omnibridge/doctrine:ro
      # omnisense/omnibridge as checked out over the image's (audit R14): Omnibridge\Schema, which
      # the Doctrine checkout above and the core's Base\Database\Schema read.
      - ${OMNIBRIDGE:-../../../omnibridge}/core:/srv/demo/vendor/omnisense/omnibridge:ro
      # omnibridge/twig as checked out over the image's (audit R24): its HelperExtension (|at,
      # |emoji_only), which the core's Twig extensions leave to it (FrameworkFreeExtensionsTest).
      - ${OMNIBRIDGE:-../../../omnibridge}/twig:/srv/demo/vendor/omnibridge/twig:ro
      - ./app/config/bundles.php:/srv/demo/config/bundles.php:ro
      - ./app/config/routes/plugins.php:/srv/demo/config/routes/plugins.php:ro
      - ./demo.sh:/usr/local/bin/demo:ro
